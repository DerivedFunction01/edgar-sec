# edgar-sec package declaration: the single source of dependency truth.
# init_venv.py builds the venv from this file; no other package list exists.
# Pins carried verbatim from the former init_venv.py registry:
#   duckdb>=2 (full suite verified on 2.0.0; floor raised 2026-11-05)
#   pymupdf>=2.1,<2.2 (commissioned for the PDF path; PyMuPDF is AGPL-3.0)
#   pyarrow>=26,<27 (23.0.1 proven to break string/dictionary field merges
#   the pipelines rely on; 26.0.0 is the proven reference version)
# selectolax is deliberately unpinned: both backends (modest, lexbor) are
# supported indefinitely and the code falls back between them at import.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edgar-sec"
dynamic = ["version"]
description = "High-throughput, memory-safe SEC EDGAR extraction engine and pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2",
    "fastapi",
    "pandas",
    "polars",
    "psutil",
    "pyarrow>=26,<27",
    "pymupdf>=2.1,<2.2",
    "requests",
    "selectolax",
    "tqdm",
    "urllib3",
    "uvicorn",
    "zstandard",
]

[project.scripts]
edgar-sec = "edgar_sec.apps.client.operator:main"

[project.optional-dependencies]
# Test/gate tooling. httpx2 is never imported directly: the FastAPI/Starlette
# TestClient used by the viewer tests requires it as its transport.
dev = [
    "httpx2",
    "pytest",
    "pytest-timeout",
    "pytest-xdist",
    "ruff",
]

[tool.hatch.version]
path = "edgar_sec/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["edgar_sec"]
exclude = [
    "/edgar_sec/tools",
    "/edgar_sec/engine/xbrl/discovery/seed/**",
    "/edgar_sec/engine/xbrl/discovery/vintage/**",
    "/edgar_sec/engine/xbrl/discovery/sp100/**",
    "/edgar_sec/engine/xbrl/discovery/probe/**",
]
